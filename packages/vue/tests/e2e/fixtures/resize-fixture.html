<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E2E Fixture — Resize</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* Percentage-based width, not a fixed pixel size — so changing
         the real browser viewport actually changes this container's
         real size, which is what the resize spec relies on to trigger
         the real ResizeObserver path without needing to programmatically
         resize an element directly. */
      #container {
        width: 100%;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./resize-fixture.ts"></script>
  </body>
</html>
