name: CI

# Phase 0 skeleton — deliberately minimal, matching what actually exists
# today (install → typecheck → lint → test → build). No e2e, bundle-size,
# license-audit, or docs-site-build steps yet: those depend on real
# implementations and test suites this repo doesn't have until later
# phases (see docs/IMPLEMENTATION_PLAN.md). Modeled on
# keystone-dashboard-layout's own .github/workflows/ci.yml, scaled back to
# match this project's actual current state rather than copying steps for
# scripts/suites that don't exist here.
#
# Turbo-orchestrated (`turbo run <task> --filter=...`), scoped to the
# two packages that are actually complete today —
# keystone-chartjs-core and keystone-chartjs-vue. keystone-chartjs-react
# and keystone-chartjs-angular are real, scaffolded packages with their
# own typecheck/lint/build scripts (so turbo does NOT skip them the way
# it skips a script a package's package.json never defines), but their
# own component stubs are documented, known-incomplete placeholders
# (Phase 3/4, not started — see each package's own README and
# docs/IMPLEMENTATION_PLAN.md) that don't compile against Core's current
# API on purpose. Gating CI on them would fail on every single push until
# their real implementation lands. The root `package.json` scripts
# themselves (`pnpm typecheck`, etc.) stay unscoped, covering all four
# packages for local/manual use — only CI's own invocation here is
# narrowed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Root package.json's own engines field is ">=22.0.0".
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core, vue — react/angular not started)
        run: pnpm exec turbo run typecheck --filter=keystone-chartjs-core --filter=keystone-chartjs-vue

      - name: Lint (core, vue — react/angular not started)
        run: pnpm exec turbo run lint --filter=keystone-chartjs-core --filter=keystone-chartjs-vue

      - name: Unit + component tests (with coverage) (core, vue — react/angular not started)
        run: pnpm exec turbo run test:coverage --filter=keystone-chartjs-core --filter=keystone-chartjs-vue

      - name: Build (core, vue — react/angular not started)
        run: pnpm exec turbo run build --filter=keystone-chartjs-core --filter=keystone-chartjs-vue

      - name: Install documentation site dependencies
        # docs/site is a separate, standalone project (its own
        # package.json/pnpm-workspace.yaml, deliberately outside this
        # root workspace — see docs/site/pnpm-workspace.yaml's own header
        # comment for why) — install its own dependencies explicitly
        # rather than assuming the root `pnpm install` above covered it,
        # since it doesn't.
        working-directory: docs/site
        run: pnpm install

      - name: Build documentation site
        working-directory: docs/site
        run: pnpm build
